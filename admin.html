<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="admin.css">
    <script defer src="admin.js"></script>
    <title>Document</title>
</head>
<body>
    <header class="header-admin">
        <h1 class="h1-admin">PAINEL ADMIN</h1>

        <a class="link-admin" href="#"><img src="/public/icons/config.png"/></a>

    </header>

    <main>

        <section>

            <div class="box-prod">
                <a class="link-prod" href="/admin.html">
                    
                    <img class="link-prod-img img-normal" src="/public/icons/boxw.png" alt="icone de caixa">
                    <img class="link-prod-img img-ativo" src="/public/icons/box.png" alt="icone de caixa"> 
                    Produtos
                </a>

                <a class="link-prod2" href="/pedidos.html"><img src="/public/icons/seta.png" alt="icone de caixa"> Pedidos</a>
            </div>

            <button class="btn-add" id="btn-add"><img src="/public/icons/plus.png" alt=""> Adicionar Produto</button>
        </section>

        <section>

        <div class="overlay" id="overlay">
            <form class="form-add" id="form-add">

                <header class="header-form">
                    <h2>NOVO PRODUTO</h2>
                    <button class="btn-close" id="btn-close" type="button"><img src="/public/icons/close.png" alt="icone de x"></button>
                </header>

                <div class="box-form">
                    <label>Nome</label>
                    <input  type="text" name="nome" id="nome"/>
                </div>

                 <div class="box-form">
                    <label>Descrição</label>
                    <textarea name="descricao" id="descricao"></textarea>
                </div>

                <div class="box-form2">

                     <div class="box-preco">
                        <label>Preço R$</label>
                        <input type="number" name="preco" id="preco" placeholder="0,00"  step="0.01" min="0"/>
                     </div>

                     <div class="box-categoria">
                        <label>Categoria</label>
                        <select id="categoria" name="categoria">
                            
                            <option value="espetos">Espetos</option>
                            <option value="picanha" >Picanha</option>
                            <option value="jantinha">Jantinha</option>
                            <option value="bebidas">Bebidas</option>
                            <option value="acompanhamentos">Acompanhamentos</option>
                            <option value="arroz">Arroz Temperado</option>
                           
                        </select>
                     </div>

                </div>

                <div class="box-file">
                   <label for="imagem" class="label-file">Escolher Imagem</label>
                   <input type="file" name="imagem" id="imagem" accept="image/*" style="display: none;">

                   <img id="preview" class="preview"/>
                </div>

                <p class="mensagem" id="mensagem"></p>

                <button type="submit" class="btn-add-prod" id="btn-add-prod"> Adicionar Produto</button>
            </form>

        </div>
        </section>

        
        <section class="container-produtos">

            
            <div id="lista-produtos">

            </div>
        </section>
    </main>
</body>
</html>
